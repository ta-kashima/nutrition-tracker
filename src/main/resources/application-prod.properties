# ===========================================
# 本番環境設定 (application-prod.properties)
# ===========================================
# 起動時に SPRING_PROFILES_ACTIVE=prod を設定して使用

# ===========================================
# サーバー設定
# ===========================================
server.port=${PORT:8080}

# ===========================================
# PostgreSQL Database設定
# ===========================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nutrition_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA設定
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===========================================
# H2 Console無効化（本番環境）
# ===========================================
spring.h2.console.enabled=false

# ===========================================
# Thymeleaf設定
# ===========================================
spring.thymeleaf.cache=true

# ===========================================
# セッション設定
# ===========================================
server.servlet.session.timeout=1h
server.servlet.session.cookie.name=NUTRITION_SESSION
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===========================================
# Firebase設定
# ===========================================
firebase.enabled=${FIREBASE_ENABLED:true}
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-credentials.json}

# ===========================================
# ログ設定
# ===========================================
logging.level.com.example.nutrition=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ===========================================
# 本番セキュリティ設定
# ===========================================
server.error.include-stacktrace=never
server.error.include-message=never
