<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 - 栄養管理アプリ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>栄養管理アプリ</h1>
            <nav>
                <a href="/">ホーム</a>
                <a href="/dashboard">ダッシュボード</a>
                <a href="/records">記録</a>
                <a href="/foods">食品マスタ</a>
                <a href="/meal-sets">食事セット</a>
                <a href="/settings" class="active">設定</a>
                <a href="#" onclick="logout(); return false;" class="logout-link">ログアウト</a>
            </nav>
        </header>

        <main>
            <section class="page-header">
                <h2>設定</h2>
            </section>

            <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

            <form th:action="@{/settings}" method="post" class="settings-form">
                <section class="settings-section">
                    <h3>プロフィール</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">名前</label>
                            <input type="text" name="name" id="name" th:value="${user.name}">
                        </div>
                        <div class="form-group">
                            <label for="email">メールアドレス</label>
                            <input type="email" name="email" id="email" th:value="${user.email}" readonly>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">年齢</label>
                            <input type="number" name="age" id="age" th:value="${user.age}">
                        </div>
                        <div class="form-group">
                            <label for="gender">性別</label>
                            <select name="gender" id="gender">
                                <option value="male" th:selected="${user.gender == 'male'}">男性</option>
                                <option value="female" th:selected="${user.gender == 'female'}">女性</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="height">身長 (cm)</label>
                            <input type="number" name="height" id="height" step="0.1" th:value="${user.height}">
                        </div>
                        <div class="form-group">
                            <label for="weight">体重 (kg)</label>
                            <input type="number" name="weight" id="weight" step="0.1" th:value="${user.weight}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="activityLevel">活動レベル</label>
                            <select name="activityLevel" id="activityLevel">
                                <option value="sedentary" th:selected="${user.activityLevel == 'sedentary'}">座り仕事中心</option>
                                <option value="light" th:selected="${user.activityLevel == 'light'}">軽い運動</option>
                                <option value="moderate" th:selected="${user.activityLevel == 'moderate'}">適度な運動</option>
                                <option value="active" th:selected="${user.activityLevel == 'active'}">活発な運動</option>
                                <option value="very_active" th:selected="${user.activityLevel == 'very_active'}">非常に活発</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="settings-section">
                    <h3>栄養目標</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="targetCalories">目標カロリー (kcal)</label>
                            <input type="number" name="targetCalories" id="targetCalories" th:value="${user.targetCalories}">
                        </div>
                        <div class="form-group">
                            <label for="targetProtein">目標タンパク質 (g)</label>
                            <input type="number" name="targetProtein" id="targetProtein" th:value="${user.targetProtein}">
                        </div>
                        <div class="form-group">
                            <label for="targetFat">目標脂質 (g)</label>
                            <input type="number" name="targetFat" id="targetFat" th:value="${user.targetFat}">
                        </div>
                        <div class="form-group">
                            <label for="targetCarbs">目標炭水化物 (g)</label>
                            <input type="number" name="targetCarbs" id="targetCarbs" th:value="${user.targetCarbs}">
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2025 栄養管理アプリ</p>
        </footer>
    </div>

    <script>
        async function logout() {
            if (!confirm('ログアウトしますか？')) return;
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    window.location.href = '/login';
                } else {
                    alert('ログアウトに失敗しました');
                }
            } catch (error) {
                console.error('Logout error:', error);
                alert('ログアウトに失敗しました');
            }
        }
    </script>
</body>
</html>
