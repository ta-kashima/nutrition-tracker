<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記録 - 栄養管理アプリ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>栄養管理アプリ</h1>
            <nav>
                <a href="/">ホーム</a>
                <a href="/dashboard">ダッシュボード</a>
                <a href="/records" class="active">記録</a>
                <a href="/foods">食品マスタ</a>
                <a href="/meal-sets">食事セット</a>
                <a href="/settings">設定</a>
                <a href="#" onclick="logout(); return false;" class="logout-link">ログアウト</a>
            </nav>
        </header>

        <main>
            <section class="page-header">
                <h2>食事記録</h2>
                <form class="date-selector" method="get" action="/records">
                    <input type="date" name="date" th:value="${selectedDate}" onchange="this.form.submit()">
                </form>
            </section>

            <!-- 日別サマリー -->
            <section class="day-summary">
                <p>カロリー: <strong th:text="${summary.totalCalories}">0</strong> kcal |
                   タンパク質: <strong th:text="${summary.totalProtein}">0</strong> g |
                   脂質: <strong th:text="${summary.totalFat}">0</strong> g |
                   炭水化物: <strong th:text="${summary.totalCarbs}">0</strong> g</p>
            </section>

            <!-- 記録追加フォーム -->
            <section class="add-record-section">
                <h3>記録を追加</h3>
                <form th:action="@{/records}" method="post" class="record-form">
                    <input type="hidden" name="date" th:value="${selectedDate}">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="mealType">食事タイプ</label>
                            <select name="mealType" id="mealType" required>
                                <option value="breakfast">朝食</option>
                                <option value="lunch">昼食</option>
                                <option value="dinner">夕食</option>
                                <option value="snack">間食</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="foodSelect">食品を選択</label>
                            <select id="foodSelect" onchange="selectFood(this)">
                                <option value="">-- 食品を選択 --</option>
                                <option th:each="food : ${foods}"
                                        th:value="${food.foodId}"
                                        th:text="${food.foodName}"
                                        th:data-name="${food.foodName}"
                                        th:data-grams="${food.portionGrams}"
                                        th:data-calories="${food.calories}"
                                        th:data-protein="${food.protein}"
                                        th:data-fat="${food.fat}"
                                        th:data-carbs="${food.carbohydrates}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="foodName">食品名</label>
                            <input type="text" name="foodName" id="foodName" required>
                        </div>
                        <div class="form-group">
                            <label for="grams">グラム数</label>
                            <input type="number" name="grams" id="grams" step="0.1" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="calories">カロリー (kcal)</label>
                            <input type="number" name="calories" id="calories" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="protein">タンパク質 (g)</label>
                            <input type="number" name="protein" id="protein" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="fat">脂質 (g)</label>
                            <input type="number" name="fat" id="fat" step="0.1" required>
                        </div>
                        <div class="form-group">
                            <label for="carbohydrates">炭水化物 (g)</label>
                            <input type="number" name="carbohydrates" id="carbohydrates" step="0.1" required>
                        </div>
                    </div>

                    <input type="hidden" name="foodId" id="foodId">
                    <button type="submit" class="btn btn-primary">記録を追加</button>
                </form>
            </section>

            <!-- 記録一覧 -->
            <section class="records-list">
                <h3>今日の記録</h3>
                <table th:if="${!records.isEmpty()}">
                    <thead>
                        <tr>
                            <th>食事</th>
                            <th>食品名</th>
                            <th>グラム</th>
                            <th>カロリー</th>
                            <th>P</th>
                            <th>F</th>
                            <th>C</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="record : ${records}">
                            <td th:text="${record.mealType == 'breakfast' ? '朝食' : (record.mealType == 'lunch' ? '昼食' : (record.mealType == 'dinner' ? '夕食' : '間食'))}">食事</td>
                            <td th:text="${record.foodName}">食品名</td>
                            <td th:text="${record.grams}">0</td>
                            <td th:text="${record.calories}">0</td>
                            <td th:text="${record.protein}">0</td>
                            <td th:text="${record.fat}">0</td>
                            <td th:text="${record.carbohydrates}">0</td>
                            <td>
                                <form th:action="@{/records/{id}/delete(id=${record.recordId})}" method="post" style="display:inline;">
                                    <input type="hidden" name="date" th:value="${selectedDate}">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('削除しますか？')">削除</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <p th:if="${records.isEmpty()}" class="empty">記録がありません</p>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 栄養管理アプリ</p>
        </footer>
    </div>

    <script>
        function selectFood(select) {
            const option = select.options[select.selectedIndex];
            if (option.value) {
                document.getElementById('foodId').value = option.value;
                document.getElementById('foodName').value = option.dataset.name;
                document.getElementById('grams').value = option.dataset.grams;
                document.getElementById('calories').value = option.dataset.calories;
                document.getElementById('protein').value = option.dataset.protein;
                document.getElementById('fat').value = option.dataset.fat;
                document.getElementById('carbohydrates').value = option.dataset.carbs;
            }
        }

        async function logout() {
            if (!confirm('ログアウトしますか？')) return;
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    window.location.href = '/login';
                } else {
                    alert('ログアウトに失敗しました');
                }
            } catch (error) {
                console.error('Logout error:', error);
                alert('ログアウトに失敗しました');
            }
        }
    </script>
</body>
</html>
