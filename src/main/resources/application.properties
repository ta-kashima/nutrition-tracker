# ===========================================
# 開発環境設定 (application.properties)
# ===========================================
# 本番環境では環境変数 SPRING_PROFILES_ACTIVE=prod を設定
# ローカル開発時は firebase.enabled=false で動作確認可能

spring.application.name=nutrition-tracker
server.port=${PORT:8080}

# ===========================================
# H2 Database設定（開発用）
# ===========================================
spring.datasource.url=jdbc:h2:file:./data/nutrition_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA設定
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console（開発用のみ有効）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# Thymeleaf設定
# ===========================================
spring.thymeleaf.cache=false

# ===========================================
# セッション設定
# ===========================================
server.servlet.session.timeout=24h
server.servlet.session.cookie.name=NUTRITION_SESSION

# ===========================================
# Firebase設定
# ===========================================
# 環境変数 FIREBASE_CONFIG_PATH で上書き可能
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-credentials.json}
# 開発時はfalseにして認証なしで動作確認可能
firebase.enabled=${FIREBASE_ENABLED:false}

# ===========================================
# ログ設定
# ===========================================
logging.level.com.example.nutrition=DEBUG
logging.level.org.springframework.security=WARN
